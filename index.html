<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WinTube Discovery</title>
<style>
  :root{
    --bg:#ffffff; --fg:#111; --card:#f1f1f1; --accent-start:#000A61; --accent-end:#00129B;
  }
  body{
    margin:0;
    font-family: Verdana;
    font-weight: bold;
    background:var(--bg);
    color:var(--fg);
    transition:background .18s,color .18s;
  }
  body.dark{
    --bg:#0f1113;
    --fg:#eaeaea;
    --card:#1f1f22;
  }
  .topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 24px;
    background:linear-gradient(90deg,var(--accent-start),var(--accent-end));
    color:#fff;
    z-index:30;
  }
  .controls{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
  }
  .container{
    max-width:1400px;
    margin:80px auto 30px;
    padding:0 24px;
  }
  .player-wrap{
    background:var(--card);
    border-radius:12px;
    padding:16px;
    box-shadow:0 8px 22px rgba(0,0,0,.08);
    margin-bottom:24px;
  }
  #player{
    width:100%;
    aspect-ratio:16/9;
    border-radius:10px;
    border:0;
  }
  .channel-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:10px;
    background:var(--card);
    padding:10px 14px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.05);
  }
  .channel-bar img{
    border-radius:50%;
    width:50px;
    height:50px;
    object-fit:cover;
  }
  .channel-info{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .channel-name{
    font-size:16px;
    font-weight:bold;
  }
  .video-views{
    font-size:13px;
    color:rgba(0,0,0,.6);
  }
  .video-desc{
    font-size:14px;
    color:rgba(0,0,0,.8);
    margin-top:4px;
    max-height:60px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  body.dark .video-views{color:rgba(255,255,255,.6);}
  body.dark .video-desc{color:rgba(255,255,255,.8);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
  }
  .category{
    margin:12px 0;
  }
  .cat-title{
    font-weight:bold;
    font-size:18px;
    margin:10px 0 6px;
  }
  .thumb{
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    box-shadow:0 6px 16px rgba(0,0,0,.06);
    transition:transform .15s;
  }
  .thumb:hover{
    transform:scale(1.04);
  }
  .thumb img{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:16/9;
    object-fit:cover;
  }
  .thumb .t{
    padding:10px;
    font-weight:bold;
    font-size:14px;
    color:var(--fg);
  }
  body.dark .thumb .t{color:var(--fg);}
</style>
</head>
<body>

<div class="topbar">
  <div class="left">WinTube Discovery</div>
  <div class="controls">
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
  </div>
</div>

<main class="container">
  <section class="player-wrap">
    <iframe id="player" src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div class="channel-bar">
      <img id="channelProfile" src="https://i.imgur.com/OwphEKv.png" alt="Profile">
      <div class="channel-info">
        <div class="channel-name" id="channelName">No video selected</div>
        <div class="video-views" id="viewsCount"></div>
        <div class="video-desc" id="videoDesc"></div>
      </div>
    </div>
  </section>

  <section id="video-list-area"></section>
</main>

<script>
const API_KEY = 'AIzaSyA1Xv4cKQjgS6uvAZZ4ysIDBpHWwUWeksA';

const categorized = {
  "Other":[
    {url:"https://youtu.be/Y341HIbHzGs", title:"TWAN 4:3"},
    {url:"https://youtu.be/OLBVr0L7zGo", title:"TWA Radio Frutiger areo"},
    {url:"https://youtu.be/cM_nJw4BT6Y", title:"TWA Radio other"},
    {url:"https://youtu.be/38UahavvNtw", title:"Windows: Final Update - Part 1 - The Murder"}
  ],
  "Special":[
    {url:"https://youtu.be/XYeG8JHZitU", title:"Happy Birthday Windows 7 (Full)"}
  ],
  "TUI":[
    {url:"https://youtu.be/taRL5GOsCdM", title:"TUI 1 - the start of the outbreak"}
  ],
  "ATCITA":[
    {url:"https://youtu.be/0zaUXku15mE", title:"ATCITA 1 - tired"},
    {url:"https://youtu.be/j_IC4bgDjGg", title:"ATCITA 2 - the demise"},
    {url:"https://youtu.be/0nktRtXSwFQ", title:"ATCITA 3 - meeting others"},
    {url:"https://youtu.be/icNhbX9r3ZE", title:"ATCITA 4 - arrival and capture"},
    {url:"https://youtu.be/I15EdtFU6aE", title:"ATCITA 5A - the search for Vienna"},
    {url:"https://youtu.be/yWGWml5YYek", title:"ATCITA 5B - the search for Vienna 2"},
    {url:"https://youtu.be/iyQmF9mtOVs", title:"ATCITA 6 - solution plan"},
    {url:"https://youtu.be/hedyCgmgMws", title:"ATCITA 7 - the plan"},
    {url:"https://youtu.be/I6JHsnqc69g", title:"ATCITA 8 - back to the building"}
  ],
  "Windows XP’s First Days":[
    {url:"https://youtu.be/qX50c3wnW6M", title:"Windows XP’s First days S1 E1"},
    {url:"https://youtu.be/jPTauwoWp6U", title:"Windows XP’s First days S1 E2"},
    {url:"https://youtu.be/czQb2TeX5bE", title:"Windows XP’s First days S1 E3"}
  ]
};

function flattenCategories(obj){
  const out = [];
  for(const cat of Object.keys(obj)){
    obj[cat].forEach(v => out.push(Object.assign({}, v, {category:cat})));
  }
  return out;
}

let flat = flattenCategories(categorized);

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const listArea = document.getElementById('video-list-area');
const player = document.getElementById('player');
const channelProfile = document.getElementById('channelProfile');
const channelName = document.getElementById('channelName');
const viewsCount = document.getElementById('viewsCount');
const videoDesc = document.getElementById('videoDesc');
const categorizeToggle = document.getElementById('categorizeToggle');
const darkToggle = document.getElementById('darkToggle');

function extractID(url){
  if(!url) return '';
  url = String(url).trim();
  let m = url.match(/(?:v=|\/v\/|youtu\.be\/|embed\/)([A-Za-z0-9_\-]{6,})/);
  return m && m[1] ? m[1] : url.split('?')[0];
}

function makeThumb(id,title,url){
  const div = document.createElement('div');
  div.className = 'thumb';
  const img = document.createElement('img');
  img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  img.alt = title;
  const t = document.createElement('div');
  t.className = 't';
  t.textContent = title;
  div.appendChild(img);
  div.appendChild(t);
  div.onclick = ()=> loadToPlayer(id,title,url);
  return div;
}

function renderCategorized(){
  listArea.innerHTML = '';
  for(const cat of Object.keys(categorized)){
    const section = document.createElement('div');
    section.className = 'category';
    const h = document.createElement('div');
    h.className = 'cat-title';
    h.textContent = cat;
    section.appendChild(h);
    const g = document.createElement('div');
    g.className = 'grid';
    categorized[cat].forEach(item=>{
      const id = extractID(item.url);
      g.appendChild(makeThumb(id,item.title,item.url));
    });
    section.appendChild(g);
    listArea.appendChild(section);
  }
}

function renderRandom(){
  listArea.innerHTML = '';
  const arr = shuffle(flat.slice());
  const g = document.createElement('div');
  g.className = 'grid';
  arr.forEach(item=>{
    const id = extractID(item.url);
    g.appendChild(makeThumb(id,item.title,item.url));
  });
  listArea.appendChild(g);
}

categorizeToggle.addEventListener('change', ()=> render());
darkToggle.addEventListener('change', e => document.body.classList.toggle('dark', e.target.checked));

async function loadToPlayer(id,title,url){
  channelName.textContent = title;
  videoDesc.textContent = 'Loading info...';
  viewsCount.textContent = '';
  player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  try{
    const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${API_KEY}`);
    const data = await res.json();
    if(data.items && data.items.length){
      const video = data.items[0];
      channelName.textContent = video.snippet.channelTitle || title;
      videoDesc.textContent = video.snippet.description || '';
      viewsCount.textContent = video.statistics && video.statistics.viewCount ? parseInt(video.statistics.viewCount).toLocaleString() + ' views' : '';

      if(video.snippet.channelId){
        const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${video.snippet.channelId}&key=${API_KEY}`);
        const chData = await chRes.json();
        if(chData.items && chData.items.length){
          channelProfile.src = chData.items[0].snippet.thumbnails.default.url;
        } else channelProfile.src = 'https://i.imgur.com/OwphEKv.png';
      }
    } else {
      videoDesc.textContent = '';
      channelProfile.src = 'https://i.imgur.com/OwphEKv.png';
    }
  } catch(e){
    console.error(e);
    videoDesc.textContent = '';
    channelProfile.src = 'https://i.imgur.com/OwphEKv.png';
  }
}

function render(){
  categorizeToggle.checked ? renderCategorized() : renderRandom();
}

function init(){
  if(flat.length){
    const first = flat[0];
    loadToPlayer(extractID(first.url), first.title, first.url);
  }
  render();
}

window.wintube = {render, loadToPlayer, categorized, flat};
init();
</script>
</body>
</html>
