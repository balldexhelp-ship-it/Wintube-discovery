<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WinTube Discovery</title>
<style>
:root{
  --bg:#ffffff; --fg:#111; --card:#f1f1f1; --accent-start:#000A61; --accent-end:#00129B;
}
body{margin:0;font-family:Verdana,Arial,system-ui,-apple-system; background:var(--bg); color:var(--fg); transition:background .18s,color .18s;}
body.dark{--bg:#0f1113;--fg:#eaeaea;--card:#1f1f22;}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(90deg,var(--accent-start),var(--accent-end));color:#fff;z-index:30}
.topbar .left img{height:30px;}
.controls{display:flex;gap:12px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px}
.container{max-width:1200px;margin:86px auto 40px;padding:0 16px;}
.video-list{display:flex; flex-direction:column; gap:12px;}
.thumb{cursor:pointer; display:flex; flex-direction:column; border-radius:8px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.05); transition:transform .12s;}
.thumb:hover{transform:scale(1.03);}
.thumb img{width:100%; aspect-ratio:16/9; object-fit:cover;}
.thumb .t{padding:6px;font-weight:bold;font-size:13px;color:var(--fg);font-family:Verdana;}
body.dark .thumb .t{color:var(--fg);}
.category{margin:8px 0;}
.cat-title{font-weight:800;margin:10px 0 6px;font-family:Verdana;}
/* Watch view layout */
.watch-view{display:none; margin-top:12px; display:flex; gap:12px; align-items:flex-start;}
.player-column{flex:2; display:flex; flex-direction:column; gap:12px;}
.player-wrap{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
#player{width:100%; aspect-ratio:16/9; border-radius:8px; border:0;}
.video-title{font-family:Verdana;font-weight:bold;font-size:16px;margin:4px 0;}
.video-info{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 6px 14px rgba(0,0,0,.06);}
.video-info .channel{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.video-info .channel img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.video-info .views{font-size:13px;color:rgba(0,0,0,.6);}
.video-info .desc{font-size:14px;margin-top:8px;color:rgba(0,0,0,.8);}
body.dark .views, body.dark .desc{color:rgba(255,255,255,.7);}
.sidebar{flex:1; display:flex; flex-direction:column; gap:6px; max-height:100vh; overflow-y:hidden; border-left:1px solid #000; padding-left:6px;}
.sidebar .thumb{border-bottom:2px solid black; margin-bottom:0; padding-bottom:0;}
.sidebar .thumb img{height:auto; width:100%; display:block;}
.sidebar .thumb .t{padding:4px 0; text-align:left;}
@media(max-width:900px){
  .watch-view{flex-direction:column;}
  .sidebar{flex-direction:row; flex-wrap:wrap; max-height:none; border-left:none; padding-left:0;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="left"><img src="https://i.imgur.com/Osi9wYB.png" alt="WinTube Discovery"></div>
  <div class="controls">
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
  </div>
</div>

<main class="container">
  <div class="video-list" id="videoListArea"></div>

  <div class="watch-view" id="watchView">
    <div class="player-column">
      <div class="player-wrap">
        <iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="video-title" id="videoTitle">Title</div>
      <div class="video-info">
        <div class="channel">
          <img id="channelProfile" src="https://i.imgur.com/OwphEKv.png">
          <div id="channelName"></div>
        </div>
        <div class="views" id="viewsCount"></div>
        <div class="desc" id="videoDesc"></div>
      </div>
    </div>
    <div class="sidebar" id="videoSidebar"></div>
  </div>
</main>

<script>
const API_KEY = 'AIzaSyA1Xv4cKQjgS6uvAZZ4ysIDBpHWwUWeksA';
const categorized = {
  "Other":[
    {url:"https://youtu.be/Y341HIbHzGs?si=1CAX0VcRObsga4Ol", title:"TWAN 4:3"},
    {url:"https://youtu.be/OLBVr0L7zGo?si=LUCz0f-iS_SpmVgp", title:"TWA Radio Frutiger areo"},
    {url:"https://youtu.be/cM_nJw4BT6Y?si=ryCRCN2UWgSZhFZo", title:"TWA Radio other"},
    {url:"https://youtu.be/38UahavvNtw?si=pQGyUCvk1XZkwVh-", title:"Windows: Final Update - Part 1 - The Murder"}
  ],
  "Special":[
    {url:"https://youtu.be/XYeG8JHZitU?si=RsYR2FaPUv1FK6Mu", title:"Happy Birthday Windows 7 (Full)"}
  ],
  "Windows Lapis and Friends":[
    {url:"https://youtu.be/vrOQFA88j9A?si=aubDPbzNUN2L4aw2", title:"Windows lapis and friends part 1 - a sticky situation"},
    {url:"https://youtu.be/lUqZyfLGgRE?si=Qt5ZLjxW6CIKspcK", title:"Windows lapis and friends portal trouble (part 2)"},
    {url:"https://youtu.be/VG30TaK--zc?si=AzSYsVwSYGIJVkSg", title:"Windows lapis and friends trouble in Bliss (part 3)"},
    {url:"https://youtu.be/nV1_SDDzzpA?si=_OR6zqynAFNa5lw5", title:"Windows lapis and friends Vista is back? (part 4)"},
    {url:"https://youtu.be/--NK4Iuhmlk?si=-Ry0wsECriunDu4r", title:"Windows lapis and friends Good bye Mojave (part 5)"}
  ],
  "TUI":[
    {url:"https://youtu.be/taRL5GOsCdM?si=UXB0sSwsKaKX2vP2", title:"TUI 1 - the start of the outbreak"}
  ],
  "ATCITA":[
    {url:"https://youtu.be/0zaUXku15mE?si=nVxD4S9jqnrAo7pE", title:"Windows 7 and the chaos in the after life - tired (part 1)"},
    {url:"https://youtu.be/j_IC4bgDjGg?si=QRHxe4vH7O4m3K5c", title:"Windows 7 and the chaos in the after life - the demise (part 2)"},
    {url:"https://youtu.be/0nktRtXSwFQ?si=zGYocR4ooXVcJyVc", title:"ATCITA 3 - meeting others and the start of problems"},
    {url:"https://youtu.be/icNhbX9r3ZE?si=gYdJdGv57clFwnza", title:"ATCITA 4 - arrival and capture"},
    {url:"https://youtu.be/I15EdtFU6aE?si=MGhx11A2twNo45RL", title:"ATCITA 5A - the search for Vienna"},
    {url:"https://youtu.be/yWGWml5YYek?si=y-n47o_L6Rnt0Qw", title:"ATCITA 5B - the search for Vienna 2"},
    {url:"https://youtu.be/iyQmF9mtOVs?si=kS0lCISSeqSk6pl5", title:"ATCITA 6 - solution plan"},
    {url:"https://youtu.be/hedyCgmgMws?si=GJjQRYOLnLd_eK7Q", title:"ATCITA 7 - the plan"},
    {url:"https://youtu.be/I6JHsnqc69g?si=enyZzCD60o-2zpc6", title:"ATCITA 8 - back to the building"}
  ],
  "Windows XP’s First Days":[
    {url:"https://youtu.be/qX50c3wnW6M?si=4czG_wfIG7j3V-5M", title:"Windows XP’s First days S1 E1"},
    {url:"https://youtu.be/jPTauwoWp6U?si=FS0ZhoEUXBL7RZg7", title:"Windows XP’s First days S1 EP 2 - a spiraling vortex"},
    {url:"https://youtu.be/czQb2TeX5bE?si=Vjbb7swDJ8Wehz-Y", title:"Windows XP’s First days S1 E3 - plan after storm"}
  ]
};

function flattenCategories(obj){const out=[];for(const cat in obj){obj[cat].forEach(v=>out.push({...v,category:cat}));}return out;}
let flat=flattenCategories(categorized);

const videoListArea=document.getElementById('videoListArea');
const watchView=document.getElementById('watchView');
const sidebar=document.getElementById('videoSidebar');
const player=document.getElementById('player');
const videoTitle=document.getElementById('videoTitle');
const channelName=document.getElementById('channelName');
const channelProfile=document.getElementById('channelProfile');
const viewsCount=document.getElementById('viewsCount');
const videoDesc=document.getElementById('videoDesc');
const categorizeToggle=document.getElementById('categorizeToggle');
const darkToggle=document.getElementById('darkToggle');

function extractID(url){if(!url)return '';url=String(url).trim();let m=url.match(/(?:v=|\/v\/|youtu\.be\/|embed\/)([A-Za-z0-9_\-]{6,})/);return m&&m[1]?m[1]:url.split('?')[0];}
function makeThumb(id,title,onClick){const div=document.createElement('div');div.className='thumb';const img=document.createElement('img');img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;const t=document.createElement('div');t.className='t';t.textContent=title;div.appendChild(img);div.appendChild(t);div.onclick=onClick;return div;}

function renderCategorized(container){container.innerHTML='';for(const cat in categorized){const section=document.createElement('div');section.className='category';const h=document.createElement('div');h.className='cat-title';h.textContent=cat;section.appendChild(h);const g=document.createElement('div');g.className='grid';categorized[cat].forEach(item=>{const id=extractID(item.url);g.appendChild(makeThumb(id,item.title,()=>openWatchView(id)));});section.appendChild(g);container.appendChild(section);}}

function renderRandom(container){container.innerHTML='';const arr=[...flat].sort(()=>Math.random()-0.5);const g=document.createElement('div');g.className='grid';arr.forEach(item=>{const id=extractID(item.url);g.appendChild(makeThumb(id,item.title,()=>openWatchView(id)));});container.appendChild(g);}

function openWatchView(id){
  watchView.style.display='flex';
  videoListArea.style.display='none';
  sidebar.style.display='flex';

  player.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  videoTitle.textContent='Loading...';
  channelName.textContent='';
  channelProfile.src='https://i.imgur.com/OwphEKv.png';
  viewsCount.textContent='';
  videoDesc.textContent='';

  // Render sidebar
  sidebar.innerHTML='';
  const otherVideos = flat.filter(v=>extractID(v.url)!==id);
  const totalVideos = otherVideos.length;
  const sidebarHeight = sidebar.clientHeight || window.innerHeight;
  const thumbHeight = Math.floor(sidebarHeight / totalVideos) - 6; // adjust for gap
  otherVideos.forEach(item=>{
    const vidID=extractID(item.url);
    const thumb=makeThumb(vidID,item.title,()=>openWatchView(vidID));
    thumb.querySelector('img').style.height=thumbHeight+'px';
    sidebar.appendChild(thumb);
  });

  // Fetch video info
  fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${API_KEY}`)
  .then(r=>r.json())
  .then(data=>{
    if(data.items && data.items.length){
      const vid=data.items[0];
      videoTitle.textContent=vid.snippet.title;
      channelName.textContent=vid.snippet.channelTitle;
      videoDesc.textContent=vid.snippet.description;
      viewsCount.textContent=vid.statistics?.viewCount ? parseInt(vid.statistics.viewCount).toLocaleString()+' views':'';
      if(vid.snippet.channelId){
        fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${vid.snippet.channelId}&key=${API_KEY}`)
        .then(r=>r.json()).then(ch=>{
          if(ch.items && ch.items.length){
            channelProfile.src = ch.items[0].snippet.thumbnails.default.url;
          }
        });
      }
    }
  }).catch(()=>{videoTitle.textContent='Error loading info';});
}

categorizeToggle.addEventListener('change',()=>categorizeToggle.checked ? renderCategorized(videoListArea) : renderRandom(videoListArea));
darkToggle.addEventListener('change',e=>document.body.classList.toggle('dark',e.target.checked));

// Initial render
(categorizeToggle.checked ? renderCategorized(videoListArea) : renderRandom(videoListArea))();
</script>
</body>
</html>
