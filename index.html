<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WinTube Discovery</title>
<style>
  :root{
    --bg:#ffffff; --fg:#111; --card:#f1f1f1; --accent-start:#000A61; --accent-end:#00129B;
  }
  body{
    margin:0;
    font-family:Verdana;
    font-weight:bold;
    background:var(--bg);
    color:var(--fg);
    transition:background .18s,color .18s;
  }
  body.dark{
    --bg:#0f1113;
    --fg:#eaeaea;
    --card:#1f1f22;
  }
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px;
    background:linear-gradient(90deg,var(--accent-start),var(--accent-end));
    color:#fff;
    z-index:30;
  }
  .controls{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:14px;
  }
  .container{
    max-width:1200px;
    margin:86px auto 40px;
    padding:0 16px;
  }
  .player-wrap{
    background:var(--card);
    border-radius:10px;
    padding:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    margin-bottom:18px;
  }
  #player{
    width:100%;
    aspect-ratio:16/9;
    border-radius:8px;
    border:0;
  }
  .channel-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:8px;
    background:var(--card);
    padding:8px 12px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
  }
  .channel-bar img{
    border-radius:50%;
    width:48px;
    height:48px;
    object-fit:cover;
  }
  .channel-info{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .channel-name{
    font-size:14px;
    font-weight:bold;
  }
  .video-desc{
    font-size:13px;
    margin-top:4px;
    max-height:48px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .category{
    margin:8px 0;
  }
  .cat-title{
    font-weight:bold;
    margin:10px 0 6px;
  }
  .thumb{
    background:var(--card);
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    box-shadow:0 6px 14px rgba(0,0,0,.06);
    transition:transform .12s;
  }
  .thumb:hover{transform:scale(1.03);}
  .thumb img{width:100%; height:auto; aspect-ratio:16/9; object-fit:cover;}
  .thumb .t{
    padding:8px;
    font-size:13px;
    color:var(--fg);
    font-weight:bold;
  }
  body.dark .thumb .t{color:var(--fg);}
</style>
</head>
<body>
<div class="topbar">
  <div class="left">WinTube Discovery</div>
  <div class="controls">
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
  </div>
</div>

<main class="container">
  <section class="player-wrap">
    <iframe id="player" src="" allowfullscreen></iframe>
    <div class="channel-bar">
      <img id="channelProfile" src="https://i.imgur.com/OwphEKv.png" alt="Profile">
      <div class="channel-info">
        <div class="channel-name" id="channelName">No video selected</div>
        <div class="video-desc" id="videoDesc"></div>
      </div>
    </div>
  </section>
  <section id="video-list-area"></section>
</main>

// flatten all categories into one array
const flat = Object.values(categorized).flat();

// helpers
const listArea = document.getElementById('video-list-area');
const player = document.getElementById('player');
const channelName = document.getElementById('channelName');
const videoDesc = document.getElementById('videoDesc');
const categorizeToggle = document.getElementById('categorizeToggle');
const darkToggle = document.getElementById('darkToggle');

function extractID(url){
  let m = url.match(/(?:v=|youtu\.be\/)([\w-]+)/);
  return m ? m[1] : '';
}

function makeThumb(id,title,url){
  const div = document.createElement('div');
  div.className='thumb';
  const img=document.createElement('img');
  img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  img.alt=title;
  const t=document.createElement('div');
  t.className='t'; t.textContent=title;
  div.append(img,t);
  div.onclick=()=>loadToPlayer(id,title);
  return div;
}

function loadToPlayer(id,title){
  player.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  channelName.textContent=title;
  videoDesc.textContent='';
}

function renderCategorized(){
  listArea.innerHTML='';
  for(const cat in categorized){
    const section=document.createElement('div');
    section.className='category';
    const h=document.createElement('div'); h.className='cat-title'; h.textContent=cat;
    section.appendChild(h);
    const g=document.createElement('div'); g.className='grid';
    categorized[cat].forEach(v=>{
      g.appendChild(makeThumb(extractID(v.url),v.title,v.url));
    });
    section.appendChild(g);
    listArea.appendChild(section);
  }
}

function renderRandom(){
  listArea.innerHTML='';
  const g=document.createElement('div'); g.className='grid';
  flat.forEach(v=>g.appendChild(makeThumb(extractID(v.url),v.title,v.url)));
  listArea.appendChild(g);
}

function render(){categorizeToggle.checked?renderCategorized():renderRandom();}

categorizeToggle.addEventListener('change',render);
darkToggle.addEventListener('change',e=>document.body.classList.toggle('dark',e.target.checked));

function init(){
  if(flat.length) loadToPlayer(extractID(flat[0].url),flat[0].title);
  render();
}
init();
