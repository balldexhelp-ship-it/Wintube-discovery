<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinTube</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;transition:background .2s,color .2s;}
  body.dark{background:#121212;color:#eee;}
  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(90deg,#000A61,#00129B);color:#fff;z-index:30;}
  .controls{display:flex;gap:12px;align-items:center;}
  .controls label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14px;}
  .container{max-width:1200px;margin:86px auto 40px;padding:0 16px;}
  .player-wrap{background:#f1f1f1;border-radius:10px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:18px;}
  body.dark .player-wrap{background:#1f1f22;}
  #player{width:100%;aspect-ratio:16/9;border-radius:8px;border:0;}
  .player-info{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:12px;flex-wrap:wrap;}
  .channel-profile{display:flex;align-items:center;gap:10px;}
  .channel-profile img{border-radius:50%;width:40px;height:40px;object-fit:cover;}
  .channel-name{font-weight:700;}
  .video-views{font-size:14px;color:#555;}
  body.dark .video-views{color:#ccc;}
  .video-desc{margin-top:6px;font-size:14px;color:#333;}
  body.dark .video-desc{color:#ddd;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .category{margin:8px 0;}
  .cat-title{font-weight:800;margin:10px 0 6px;}
  .thumb{background:#f1f1f1;border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 6px 14px rgba(0,0,0,.06);transition:transform .12s;}
  body.dark .thumb{background:#2a2a2a;}
  .thumb:hover{transform:scale(1.03);}
  .thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;}
  .thumb .t{padding:8px;font-weight:700;font-size:13px;color:#111;}
  body.dark .thumb .t{color:#eee;}
</style>
</head>
<body>

<div class="topbar">
  <div>WinTube</div>
  <div class="controls">
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
  </div>
</div>

<main class="container">
  <section class="player-wrap">
    <iframe id="player" src="" allowfullscreen></iframe>
    <div class="player-info">
      <div class="channel-profile">
        <img id="channel-img" src="" alt="Profile">
        <span class="channel-name" id="channel-name">Channel Name</span>
      </div>
      <span class="video-views" id="video-views">0 views</span>
    </div>
    <div class="video-desc" id="video-desc">Video description will appear here.</div>
  </section>

  <section id="video-list-area"></section>
</main>

<script>
const API_KEY = 'YOUR_API_KEY';

const categorized = {
  "Other":[
    {url:"https://youtu.be/Y341HIbHzGs?si=1CAX0VcRObsga4Ol", title:"TWAN 4:3"},
    {url:"https://youtu.be/OLBVr0L7zGo?si=LUCz0f-iS_SpmVgp", title:"TWA Radio Frutiger areo"},
    {url:"https://youtu.be/cM_nJw4BT6Y?si=ryCRCN2UWgSZhFZo", title:"TWA Radio other"},
    {url:"https://youtu.be/38UahavvNtw?si=Eq3HQZ5dV3gfu571", title:"Windows: The Murder part one"}
  ],
  "Special":[
    {url:"https://youtu.be/XYeG8JHZitU?si=RsYR2FaPUv1FK6Mu", title:"Happy Birthday Windows 7 (Full)"}
  ],
  "Windows Lapis and Friends":[
    {url:"https://youtu.be/vrOQFA88j9A?si=aubDPbzNUN2L4aw2", title:"Windows lapis and friends part 1 - a sticky situation"},
    {url:"https://youtu.be/lUqZyfLGgRE?si=Qt5ZLjxW6CIKspcK", title:"Windows lapis and friends portal trouble (part 2)"},
    {url:"https://youtu.be/VG30TaK--zc?si=AzSYsVwSYGIJVkSg", title:"Windows lapis and friends trouble in Bliss (part 3)"},
    {url:"https://youtu.be/nV1_SDDzzpA?si=_OR6zqynAFNa5lw5", title:"Windows lapis and friends Vista is back? (Part 4)"},
    {url:"https://youtu.be/--NK4Iuhmlk?si=-Ry0wsECriunDu4r", title:"Windows lapis and friends Good bye Mojave (part 5)"}
  ],
  "TUI":[
    {url:"https://youtu.be/taRL5GOsCdM?si=UXB0sSwsKaKX2vP2", title:"TUI 1 - the start of the outbreak"}
  ],
  "ATCITA":[
    {url:"https://youtu.be/0zaUXku15mE?si=nVxD4S9jqnrAo7pE", title:"Windows 7 and the chaos in the after life - tired (part 1)"},
    {url:"https://youtu.be/j_IC4bgDjGg?si=QRHxe4vH7O4m3K5c", title:"Windows 7 and the chaos in the after life - the demise (part 2)"},
    {url:"https://youtu.be/0nktRtXSwFQ?si=zGYocR4ooXVcJyVc", title:"ATCITA 3 - meeting others and the start of problems"},
    {url:"https://youtu.be/icNhbX9r3ZE?si=gYdJdGv57clFwnza", title:"ATCITA 4 - arrival and capture"},
    {url:"https://youtu.be/I15EdtFU6aE?si=MGhx11A2twNo45RL", title:"ATCITA 5A - the search for Vienna"},
    {url:"https://youtu.be/yWGWml5YYek?si=y-n47o_L6Rnt0QwU", title:"ATCITA 5B - the search for Vienna 2"},
    {url:"https://youtu.be/iyQmF9mtOVs?si=kS0lCISSeqSk6pl5", title:"ATCITA 6 - solution plan"},
    {url:"https://youtu.be/hedyCgmgMws?si=GJjQRYOLnLd_eK7Q", title:"ATCITA 7 - the plan"},
    {url:"https://youtu.be/I6JHsnqc69g?si=enyZzCD60o-2zpc6", title:"ATCITA 8 - back to the building"}
  ],
  "Windows XP’s First Days":[
    {url:"https://youtu.be/qX50c3wnW6M?si=4czG_wfIG7j3V-5M", title:"Windows XP’s First days S1 E1"},
    {url:"https://youtu.be/jPTauwoWp6U?si=FS0ZhoEUXBL7RZg7", title:"Windows XP’s First days S1 EP 2 - a spiraling vortex"},
    {url:"https://youtu.be/czQb2TeX5bE?si=Vjbb7swDJ8Wehz-Y", title:"Windows XP’s First days S1 E3 - plan after storm"}
  ]
};

/* Utility */
function extractID(url){try{return (new URL(url)).searchParams.get('v') || url.split('/').pop();}catch(e){return url;}}

/* Flatten for random mode */
let flat = [];
for(const k in categorized) categorized[k].forEach(v=>flat.push({...v,category:k}));

const listArea = document.getElementById('video-list-area');
const player = document.getElementById('player');
const channelImg = document.getElementById('channel-img');
const channelName = document.getElementById('channel-name');
const videoViews = document.getElementById('video-views');
const videoDesc = document.getElementById('video-desc');
const categorizeToggle = document.getElementById('categorizeToggle');
const darkToggle = document.getElementById('darkToggle');

let current = null;

async function fetchVideoData(id){
  const videoUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${API_KEY}`;
  const resp = await fetch(videoUrl);
  const data = await resp.json();
  if(!data.items || !data.items[0]) return null;
  const item = data.items[0];
  const channelId = item.snippet.channelId;
  const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${channelId}&key=${API_KEY}`;
  const cResp = await fetch(channelUrl);
  const cData = await cResp.json();
  const channelProfile = cData.items[0].snippet.thumbnails.default.url;
  return {
    videoId:id,
    title:item.snippet.title,
    description:item.snippet.description,
    views:item.statistics.viewCount,
    channelName:item.snippet.channelTitle,
    channelProfile
  };
}

function makeThumb(id,title,url){
  const div = document.createElement('div');
  div.className='thumb';
  const img = document.createElement('img');
  img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  img.alt=title;
  const t = document.createElement('div');
  t.className='t';
  t.textContent = title;
  div.appendChild(img); div.appendChild(t);
  div.onclick=()=>loadVideo(id);
  return div;
}

async function loadVideo(id){
  const data = await fetchVideoData(id);
  if(!data) return;
  current = data;
  player.src=`https://www.youtube.com/embed/${id}?autoplay=1`;
  channelImg.src = data.channelProfile;
  channelName.textContent = data.channelName;
  videoViews.textContent = `${Number(data.views).toLocaleString()} views`;
  videoDesc.textContent = data.description;
}

function renderCategorized(){
  listArea.innerHTML='';
  for(const cat in categorized){
    const section=document.createElement('div');section.className='category';
    const h=document.createElement('div');h.className='cat-title';h.textContent=cat;
    section.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    categorized[cat].forEach(v=>g.appendChild(makeThumb(extractID(v.url),v.title,v.url)));
    section.appendChild(g);
    listArea.appendChild(section);
  }
}

function renderRandom(){
  listArea.innerHTML='';
  const arr=[...flat]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  const g=document.createElement('div');g.className='grid';
  arr.forEach(v=>g.appendChild(makeThumb(extractID(v.url),v.title,v.url)));
  listArea.appendChild(g);
}

categorizeToggle.addEventListener('change',()=>{if(categorizeToggle.checked) renderCategorized(); else renderRandom();});
darkToggle.addEventListener('change',e=>document.body.classList.toggle('dark',e.target.checked));

function init(){if(flat.length) loadVideo(extractID(flat[0].url)); if(categorizeToggle.checked) renderCategorized(); else renderRandom();}
init();
</script>
</body>
</html>
