<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WinTube</title>
<style>
  body { margin:0; font-family: Arial,sans-serif; background:white; color:#000; transition: background 0.3s,color 0.3s; }
  body.dark { background:#121212; color:#eee; }

  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:linear-gradient(to right,#000A61,#00129B); color:white; font-weight:bold; position:fixed; width:100%; top:0; z-index:100; }
  .top-bar button { background: rgba(255,255,255,0.2); border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:5px; }
  .top-bar button.active { background: rgba(255,255,255,0.6); color:#00129B; }
  .top-bar button:hover { background: rgba(255,255,255,0.4); }

  #video-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:15px; padding:100px 20px 20px 20px; max-width:1200px; margin:auto; }
  .video-card { background:#f1f1f1; border-radius:8px; overflow:hidden; cursor:pointer; transition: transform 0.2s; display:flex; flex-direction:column; }
  body.dark .video-card { background:#2a2a2a; }
  .video-card:hover { transform:scale(1.03); }
  .video-card img { width:100%; aspect-ratio:16/9; object-fit:cover; }
  .video-card .title { padding:8px; font-size:14px; font-weight:bold; }
  body.dark .video-card .title { color:#eee; }

  .popup { display:none; position:fixed; top:120px; left:50%; transform:translateX(-50%) scale(0.9); background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:1000; padding:15px; overflow:auto; opacity:0; transition: opacity 0.3s ease, transform 0.3s ease; width:60vw; max-width:900px; min-width:400px; max-height:75vh; }
  @media (max-width:768px){.popup{width:85vw;min-width:0;max-height:80vh;}}
  body.dark .popup { background:#2a2a2a; color:#eee; }
  .popup.show { opacity:1; transform:translateX(-50%) scale(1); }

  .popup button.close-popup { background:#f00; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; font-weight:bold; display:block; margin:20px auto 0 auto; }
  .popup iframe { width:100%; border:none; border-radius:6px; margin-bottom:10px; aspect-ratio:16/9; }
  .watch-btn, .reload-btn, .copy-btn { display:inline-block; background:white; color:black; border:none; border-radius:6px; padding:8px 14px; font-weight:bold; cursor:pointer; margin-right:5px; transition:background 0.3s; }
  .watch-btn:hover, .reload-btn:hover, .copy-btn:hover { background:#ddd; }
  .link-field { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin:10px 0; font-size:14px; }
</style>
</head>
<body>

<div class="top-bar">
  <div>WinTube</div>
  <div>
    <label><input type="checkbox" id="darkToggle"> Dark Mode 🌙</label>
  </div>
</div>

<div class="popup" id="video-popup">
  <iframe id="popup-iframe" src="" allowfullscreen></iframe>
  <h2 id="popup-title"></h2>
  <input type="text" id="video-link" class="link-field" placeholder="Paste YouTube link here">
  <div>
    <button id="popup-link" class="watch-btn">Watch on YouTube</button>
    <button id="reload-btn" class="reload-btn">Reload</button>
    <button id="copy-link-btn" class="copy-btn">Copy Link</button>
  </div>
  <button class="close-popup" onclick="closePopup('video-popup')">Close</button>
</div>

<div id="video-grid"></div>

<script>
const videos = [
  // Other
  {id:'Y341HIbHzGs', title:'Other 1'},
  {id:'OLBVr0L7zGo', title:'Other 2'},
  {id:'cM_nJw4BT6Y', title:'Other 3'},
  {id:'38UahavvNtw', title:'Other 4'},

  // Special
  {id:'kfUuJ3a8R-k', title:'Special 1'},
  {id:'XYeG8JHZitU', title:'Special 2'},

  // Windows Lapis and Friends
  {id:'vrOQFA88j9A', title:'Windows Lapis 1'},
  {id:'lUqZyfLGgRE', title:'Windows Lapis 2'},
  {id:'VG30TaK–zc', title:'Windows Lapis 3'},
  {id:'nV1_SDDzzpA', title:'Windows Lapis 4'},
  {id:'–NK4Iuhmlk', title:'Windows Lapis 5'},

  // TUI
  {id:'taRL5GOsCdM', title:'TUI 1'},

  // ATCITA
  {id:'0nktRtXSwFQ', title:'ATCITA 1'},
  {id:'icNhbX9r3ZE', title:'ATCITA 2'},
  {id:'I15EdtFU6aE', title:'ATCITA 3'},
  {id:'yWGWml5YYek', title:'ATCITA 4'},
  {id:'iyQmF9mtOVs', title:'ATCITA 5'},
  {id:'I6JHsnqc69g', title:'ATCITA 6'},
  {id:'j_IC4bgDjGg', title:'ATCITA 7'},
  {id:'0zaUXku15mE', title:'ATCITA 8'},

  // Windows XP’s First Days
  {id:'qX50c3wnW6M', title:'XP First Days 1'},
  {id:'jPTauwoWp6U', title:'XP First Days 2'}
];

function createVideoCard(video) {
  const div = document.createElement('div');
  div.className = 'video-card';
  div.innerHTML = `
    <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg">
    <div class="title">${video.title}</div>`;
  div.onclick = () => openVideo(video);
  return div;
}

function renderVideos() {
  const container = document.getElementById('video-grid');
  container.innerHTML = '';
  videos.forEach(v => container.appendChild(createVideoCard(v)));
}

function openVideo(video) {
  const popup = document.getElementById('video-popup');
  popup.style.display = 'block';
  setTimeout(() => popup.classList.add('show'), 10);

  const link = `https://youtu.be/${video.id}`;
  document.getElementById('popup-iframe').src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
  document.getElementById('popup-title').textContent = video.title;
  const field = document.getElementById('video-link');
  field.value = link;

  document.getElementById('popup-link').onclick = () => window.open(field.value, '_blank');
}

document.getElementById('reload-btn').onclick = () => {
  const iframe = document.getElementById('popup-iframe');
  const field = document.getElementById('video-link');
  let id = extractID(field.value);
  iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
};

document.getElementById('copy-link-btn').onclick = () => {
  const field = document.getElementById('video-link');
  field.select();
  document.execCommand('copy');
  alert('Link copied to clipboard!');
};

function extractID(url) {
  const reg = /(?:https?:\/\/)?(?:www\.)?youtu(?:be\.com\/watch\?v=|\.be\/)([^\s&]+)/;
  const match = url.match(reg);
  return match ? match[1] : url;
}

function closePopup(id) {
  const popup = document.getElementById(id);
  popup.classList.remove('show');
  setTimeout(() => popup.style.display = 'none', 300);
  if(id==='video-popup') document.getElementById('popup-iframe').src='';
}

document.getElementById('darkToggle').onchange = e => document.body.classList.toggle('dark', e.target.checked);

renderVideos();
</script>
</body>
</html>
