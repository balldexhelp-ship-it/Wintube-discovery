<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WinTube Discovery</title>
<style>
  :root{
    --bg:#ffffff; --fg:#111; --card:#f1f1f1; --accent-start:#000A61; --accent-end:#00129B;
  }
  body{margin:0;font-family:Arial,system-ui,-apple-system; background:var(--bg); color:var(--fg); transition:background .18s,color .18s;}
  body.dark{--bg:#0f1113;--fg:#eaeaea;--card:#1f1f22;}
  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(90deg,var(--accent-start),var(--accent-end));color:#fff;z-index:30}
  .topbar .left{font-weight:700}
  .controls{display:flex;gap:12px;align-items:center}
  .controls label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px}
  .container{max-width:1200px;margin:86px auto 40px;padding:0 16px}
  .player-wrap{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:18px}
  #player{width:100%;aspect-ratio:16/9;border-radius:8px;border:0}
  .channel-bar{display:flex;align-items:center;gap:12px;margin-top:8px;background:var(--card);padding:8px 12px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.05);}
  .channel-bar img{border-radius:50%;width:48px;height:48px;object-fit:cover}
  .channel-info{flex:1;display:flex;flex-direction:column;}
  .channel-name{font-weight:700;font-size:14px;}
  .video-views{font-size:12px;color:rgba(0,0,0,.6);}
  .video-desc{font-size:13px;color:rgba(0,0,0,.8);margin-top:4px;max-height:48px;overflow:hidden;text-overflow:ellipsis;}
  body.dark .video-views{color:rgba(255,255,255,.6);}
  body.dark .video-desc{color:rgba(255,255,255,.8);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .category{margin:8px 0}
  .cat-title{font-weight:800;margin:10px 0 6px}
  .thumb{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 6px 14px rgba(0,0,0,.06);transition:transform .12s}
  .thumb:hover{transform:scale(1.03)}
  .thumb img{width:100%;height:auto;display:block;aspect-ratio:16/9;object-fit:cover}
  .thumb .t{padding:8px;font-weight:700;font-size:13px;color:var(--fg)}
  body.dark .thumb .t{color:var(--fg);}
  @media (max-width:600px){
    .topbar{padding:10px}
    .controls label{font-size:13px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="left">WinTube Discovery</div>
  <div class="controls">
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
  </div>
</div>

<main class="container">
  <section class="player-wrap">
    <iframe id="player" src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div class="channel-bar">
      <img id="channelProfile" src="" alt="Profile">
      <div class="channel-info">
        <div class="channel-name" id="channelName">No video selected</div>
        <div class="video-views" id="viewsCount"></div>
        <div class="video-desc" id="videoDesc"></div>
      </div>
    </div>
  </section>

  <section id="video-list-area">
    <!-- thumbnails injected here -->
  </section>
</main>

<script>
const API_KEY = 'AIzaSyA1Xv4cKQjgS6uvAZZ4ysIDBpHWwUWeksA';

function extractID(url){
  if(!url) return '';
  url = String(url).trim();
  if(!/https?:\/\//i.test(url) && url.indexOf('/')===-1) return url.split('?')[0];
  let m = url.match(/(?:v=|\/v\/|youtu\.be\/|embed\/)([A-Za-z0-9_\-]{6,})/);
  if(m && m[1]) return m[1];
  try {
    const u = new URL(url);
    if(u.searchParams.get('v')) return u.searchParams.get('v');
    let seg = u.pathname.split('/').filter(Boolean).pop();
    if(seg) return seg.split('?')[0];
  } catch(e){}
  return url;
}

const categorized = {
  "Other":[
    {url:"https://youtu.be/Y341HIbHzGs?si=1CAX0VcRObsga4Ol", title:"TWAN 4:3"},
    {url:"https://youtu.be/OLBVr0L7zGo?si=LUCz0f-iS_SpmVgp", title:"TWA Radio Frutiger areo"},
    {url:"https://youtu.be/cM_nJw4BT6Y?si=ryCRCN2UWgSZhFZo", title:"TWA Radio other"},
    {url:"https://youtu.be/38UahavvNtw?si=pQGyUCvk1XZkwVh-", title:"Windows: Final Update - Part 1 - The Murder"}
  ]
  // add other categories as before...
};

function flattenCategories(obj){
  const out = [];
  for(const cat of Object.keys(obj)){
    obj[cat].forEach(v => out.push(Object.assign({}, v, {category:cat})));
  }
  return out;
}

let flat = flattenCategories(categorized);

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const listArea = document.getElementById('video-list-area');
const player = document.getElementById('player');
const channelProfile = document.getElementById('channelProfile');
const channelName = document.getElementById('channelName');
const viewsCount = document.getElementById('viewsCount');
const videoDesc = document.getElementById('videoDesc');
const categorizeToggle = document.getElementById('categorizeToggle');
const darkToggle = document.getElementById('darkToggle');

let current = null;

function makeThumb(id,title,url){
  const div = document.createElement('div');
  div.className = 'thumb';
  const img = document.createElement('img');
  img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  img.alt = title;
  const t = document.createElement('div');
  t.className = 't';
  t.textContent = title;
  div.appendChild(img);
  div.appendChild(t);
  div.onclick = ()=> loadToPlayer(id,title,url);
  return div;
}

function renderCategorized(){
  listArea.innerHTML = '';
  for(const cat of Object.keys(categorized)){
    const section = document.createElement('div');
    section.className = 'category';
    const h = document.createElement('div');
    h.className = 'cat-title';
    h.textContent = cat;
    section.appendChild(h);
    const g = document.createElement('div');
    g.className = 'grid';
    categorized[cat].forEach(item=>{
      const id = extractID(item.url);
      const thumb = makeThumb(id,item.title,item.url);
      g.appendChild(thumb);
    });
    section.appendChild(g);
    listArea.appendChild(section);
  }
}

function renderRandom(){
  listArea.innerHTML = '';
  const arr = shuffle(flat.slice());
  const g = document.createElement('div');
  g.className = 'grid';
  arr.forEach(item=>{
    const id = extractID(item.url);
    const thumb = makeThumb(id,item.title,item.url);
    g.appendChild(thumb);
  });
  listArea.appendChild(g);
}

categorizeToggle.addEventListener('change', ()=> render());
darkToggle.addEventListener('change', e => document.body.classList.toggle('dark', e.target.checked));

async function loadToPlayer(id,title,url){
  current = {id,title,url};

  channelName.textContent = 'Loading...';
  channelProfile.src = '';
  viewsCount.textContent = '';
  videoDesc.textContent = 'Loading info...';

  player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;

  try{
    const videoRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=${API_KEY}`);
    const videoData = await videoRes.json();

    if(videoData.items && videoData.items.length){
      const video = videoData.items[0];
      videoDesc.textContent = video.snippet.description;
      viewsCount.textContent = parseInt(video.statistics.viewCount).toLocaleString() + ' views';

      const channelId = video.snippet.channelId;
      const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${channelId}&key=${API_KEY}`);
      const chData = await chRes.json();

      if(chData.items && chData.items.length){
        channelName.textContent = chData.items[0].snippet.title;
        channelProfile.src = chData.items[0].snippet.thumbnails.default.url;
      } else {
        channelName.textContent = video.snippet.channelTitle;
        channelProfile.src = '';
      }
    } else {
      channelName.textContent = 'Unknown channel';
      videoDesc.textContent = '';
      viewsCount.textContent = '';
      channelProfile.src = '';
    }
  } catch(e){
    console.error(e);
    channelName.textContent = 'Error loading info';
    videoDesc.textContent = '';
    viewsCount.textContent = '';
    channelProfile.src = '';
  }
}

function render(){categorizeToggle.checked ? renderCategorized() : renderRandom();}

function init(){
  if(flat.length){
    const first = flat[0];
    loadToPlayer(extractID(first.url), first.title, first.url);
  }
  render();
}

window.wintube = {render, loadToPlayer, categorized, flat};
init();
</script>
</body>
</html>
