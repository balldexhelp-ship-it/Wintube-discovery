<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WinTube Discovery</title>
<style>
  :root {
    --aero-light-bg: rgba(255, 255, 255, 0.6);
    --aero-dark-bg: rgba(25, 25, 25, 0.45);
    --light-accent: #4ca3ff;
    --dark-accent: #0078d7;
    --light-text: #0b2e4e;
    --dark-text: #eaeaea;
    --blur: blur(12px);
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #b0d8ff, #74b9ff);
    color: var(--light-text);
    backdrop-filter: var(--blur);
    transition: all 0.3s ease;
  }

  body.dark {
    background: linear-gradient(135deg, #1b1f23, #2b2f35);
    color: var(--dark-text);
  }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-radius: 0 0 12px 12px;
    background: var(--aero-light-bg);
    backdrop-filter: var(--blur);
    box-shadow: 0 2px 15px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: var(--light-text);
  }

  body.dark .topbar {
    background: var(--aero-dark-bg);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .title {
    font-weight: 700;
    font-size: 20px;
    text-shadow: 0 1px 3px rgba(255,255,255,0.5);
  }

  body.dark .title {
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  label {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  input[type="checkbox"] {
    accent-color: var(--light-accent);
  }

  body.dark input[type="checkbox"] {
    accent-color: var(--dark-accent);
  }

  .container {
    max-width: 1200px;
    margin: 90px auto 40px;
    padding: 0 16px;
  }

  .player-wrap {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
  }

  #player {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
  }

  .channel-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(8px);
    padding: 8px 14px;
    color: #000;
    font-weight: 600;
  }

  body.dark .channel-bar {
    background: rgba(40,40,40,0.6);
    color: #fff;
  }

  .channel-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .channel-info img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(0,0,0,0.15);
  }

  .player-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }

  .btn {
    background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(230,230,230,0.6));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    padding: 6px 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .btn:hover {
    filter: brightness(0.95);
  }

  body.dark .btn {
    background: linear-gradient(180deg, rgba(50,50,50,0.7), rgba(30,30,30,0.5));
    border: 1px solid rgba(255,255,255,0.1);
  }

  .category {
    margin: 18px 0;
    background: var(--aero-light-bg);
    border-radius: 10px;
    padding: 10px;
    backdrop-filter: var(--blur);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  body.dark .category {
    background: var(--aero-dark-bg);
  }

  .cat-title {
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--light-text);
  }

  body.dark .cat-title {
    color: var(--dark-text);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .thumb {
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(4px);
    transition: transform 0.15s;
  }

  .thumb:hover {
    transform: scale(1.04);
  }

  .thumb img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
  }

  .thumb .t {
    padding: 6px 8px;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>

<body>
  <div class="topbar">
    <div class="title">WinTube Discovery</div>
    <div class="controls">
      <label><input type="checkbox" id="darkToggle"> Dark</label>
      <label><input type="checkbox" id="categorizeToggle" checked> Categorize</label>
    </div>
  </div>

  <main class="container">
    <div class="player-wrap">
      <iframe id="player" src="" allowfullscreen></iframe>
      <div class="channel-bar">
        <div class="channel-info">
          <img src="https://yt3.googleusercontent.com/ytc/AIdro_mkQn9E-ExampleChannel=s88-c-k-c0x00ffffff-no-rj" id="channel-pic" alt="Channel Profile">
          <span id="channel-name">Channel Name</span>
        </div>
        <span id="view-count">0 views</span>
      </div>
      <div class="player-controls">
        <button class="btn" id="play-btn">Play</button>
        <button class="btn" id="pause-btn">Pause</button>
      </div>
    </div>

    <section id="video-list-area"></section>
  </main>

<script>
const categorized = {
  "Featured": [
    {url:"https://youtu.be/Y341HIbHzGs", title:"TWAN 4:3"},
    {url:"https://youtu.be/OLBVr0L7zGo", title:"TWA Radio Frutiger Aero"}
  ]
};

function extractID(url){
  const match = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return match ? match[1] : url;
}

const listArea = document.getElementById('video-list-area');
const player = document.getElementById('player');
const channelPic = document.getElementById('channel-pic');
const channelName = document.getElementById('channel-name');
const viewCount = document.getElementById('view-count');
const playBtn = document.getElementById('play-btn');
const pauseBtn = document.getElementById('pause-btn');
const darkToggle = document.getElementById('darkToggle');
const categorizeToggle = document.getElementById('categorizeToggle');

let currentID = null;

function renderCategorized(){
  listArea.innerHTML = '';
  for(const cat of Object.keys(categorized)){
    const section = document.createElement('div');
    section.className = 'category';
    const h = document.createElement('div');
    h.className = 'cat-title';
    h.textContent = cat;
    const g = document.createElement('div');
    g.className = 'grid';
    categorized[cat].forEach(v=>{
      const id = extractID(v.url);
      const div = document.createElement('div');
      div.className = 'thumb';
      const img = document.createElement('img');
      img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = v.title;
      div.append(img,t);
      div.onclick = ()=>loadVideo(id,v.title);
      g.appendChild(div);
    });
    section.append(h,g);
    listArea.appendChild(section);
  }
}

function loadVideo(id,title){
  currentID = id;
  player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  channelName.textContent = "Loading...";
  viewCount.textContent = "...";
  fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${id}&key=AIzaSyBZypWuC7Zg12KHQBLHeiZ-u9PBIqqMHJg`)
    .then(r=>r.json())
    .then(d=>{
      const v = d.items[0];
      if(v){
        channelName.textContent = v.snippet.channelTitle;
        viewCount.textContent = v.statistics.viewCount + " views";
        fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${v.snippet.channelId}&key=AIzaSyBZypWuC7Zg12KHQBLHeiZ-u9PBIqqMHJg`)
          .then(r=>r.json())
          .then(c=>{
            const ch = c.items[0];
            if(ch) channelPic.src = ch.snippet.thumbnails.default.url;
          });
      }
    });
}

playBtn.onclick = ()=>{player.src = `https://www.youtube.com/embed/${currentID}?autoplay=1`};
pauseBtn.onclick = ()=>{player.src = `https://www.youtube.com/embed/${currentID}`};

darkToggle.addEventListener('change', e=>document.body.classList.toggle('dark', e.target.checked));

renderCategorized();
</script>
</body>
</html>
