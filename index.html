<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinTube Mobile Discovery</title>

<style>
:root{
  --bg:#ffffff;
  --fg:#111;
  --card:#f1f1f1;
}

body{
  margin:0;
  font-family:Verdana;
  font-weight:bold;
  background:var(--bg);
  color:var(--fg);
}

/* desktop block */
.desktop-block{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

@media (min-width:1025px){
  main{display:none}
  .topbar{display:none}
  .desktop-block{display:flex}
}

/* top bar */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:linear-gradient(90deg,#000A61,#00129B);
  color:#fff;
  padding:12px;
  text-align:center;
  z-index:10;
}

/* layout */
main{
  padding:76px 12px 24px;
}

/* player */
.player-wrap{
  background:var(--card);
  border-radius:12px;
  padding:8px;
}

#player{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:8px;
}

/* channel bar */
.channel-bar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:8px;
}

.channel-bar img{
  width:44px;
  height:44px;
  border-radius:50%;
}

.channel-info{
  flex:1;
}

.channel-name{
  font-size:14px;
}

.video-views{
  font-size:12px;
  opacity:.6;
}

.video-desc{
  font-size:12px;
  margin-top:4px;
  max-height:40px;
  overflow:hidden;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px;
}

@media (min-width:600px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

.thumb{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
}

.thumb img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.thumb .t{
  padding:6px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="desktop-block">
  <div>
    <h2>mobile only</h2>
    <p>wintube discovery works on phones and tablets only</p>
  </div>
</div>

<div class="topbar">WinTube Discovery</div>

<main>
  <section class="player-wrap">
    <iframe id="player" src="about:blank" allowfullscreen></iframe>
    <div class="channel-bar">
      <img id="channelProfile" src="https://i.imgur.com/OwphEKv.png">
      <div class="channel-info">
        <div class="channel-name" id="channelName">no video selected</div>
      </div>
    </div>
  </section>

  <section id="video-list" class="grid"></section>
</main>

<script>
const videos = [
  {id:"Y341HIbHzGs", title:"TWAN 4:3"},
  {id:"OLBVr0L7zGo", title:"TWA Radio Frutiger aero"},
  {id:"cM_nJw4BT6Y", title:"TWA Radio other"},
  {id:"38UahavvNtw", title:"Windows Final Update - Part 1 - The Murder"},

  {id:"XYeG8JHZitU", title:"Happy Birthday Windows 7 (Full)"},

  {id:"vrOQFA88j9A", title:"Windows lapis and friends part 1 - a sticky situation"},
  {id:"lUqZyfLGgRE", title:"Windows lapis and friends portal trouble (part 2)"},
  {id:"VG30TaK--zc", title:"Windows lapis and friends trouble in Bliss (part 3)"},
  {id:"nV1_SDDzzpA", title:"Windows lapis and friends Vista is back? (part 4)"},
  {id:"--NK4Iuhmlk", title:"Windows lapis and friends Good bye Mojave (part 5)"},

  {id:"taRL5GOsCdM", title:"TUI 1 - the start of the outbreak"},

  {id:"0zaUXku15mE", title:"ATCITA 1 - tired"},
  {id:"j_IC4bgDjGg", title:"ATCITA 2 - the demise"},
  {id:"0nktRtXSwFQ", title:"ATCITA 3 - meeting others"},
  {id:"icNhbX9r3ZE", title:"ATCITA 4 - arrival and capture"},
  {id:"I15EdtFU6aE", title:"ATCITA 5A - the search for Vienna"},
  {id:"yWGWml5YYek", title:"ATCITA 5B - the search for Vienna 2"},
  {id:"iyQmF9mtOVs", title:"ATCITA 6 - solution plan"},
  {id:"hedyCgmgMws", title:"ATCITA 7 - the plan"},
  {id:"I6JHsnqc69g", title:"ATCITA 8 - back to the building"},

  {id:"qX50c3wnW6M", title:"Windows XP’s First Days S1 E1"},
  {id:"jPTauwoWp6U", title:"Windows XP’s First Days S1 E2"},
  {id:"czQb2TeX5bE", title:"Windows XP’s First Days S1 E3"}
];

const player = document.getElementById("player");
const list = document.getElementById("video-list");
const channelName = document.getElementById("channelName");

function loadVideo(v){
  player.src = "https://www.youtube.com/embed/"+v.id+"?autoplay=1&rel=0";
  channelName.textContent = v.title;
}

videos.forEach(v=>{
  const d = document.createElement("div");
  d.className = "thumb";
  d.innerHTML =
    "<img src='https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg'>" +
    "<div class='t'>"+v.title+"</div>";
  d.onclick = ()=>loadVideo(v);
  list.appendChild(d);
});

loadVideo(videos[0]);
</script>

</body>
</html>
