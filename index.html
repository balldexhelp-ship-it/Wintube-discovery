<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project 2000 Header</title>
<style>
  /* Reset basic margins */
  body, html {
    margin: 0;
    padding: 0;
  }

  /* Header */
  .wintube-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to right, #3b5998, #8b9dc3); /* MySpace blues */
    padding: 10px 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* subtle 2000s feel */
  }

  /* Logo */
  .wintube-header .logo {
    height: 50px;
    width: auto;
  }

  /* Optional retro nav */
  .nav-links {
    display: flex;
    gap: 15px;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  .nav-links a {
    color: white;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 3px;
    transition: background 0.3s;
  }

  .nav-links a:hover {
    background-color: rgba(255,255,255,0.3); /* subtle hover glow */
  }
</style>
</head>
<body>

<header class="wintube-header">
  <!-- Logo -->
  <img src="https://i.imgur.com/OwphEKv.png" alt="Wintube Logo" class="logo">

  <!-- Optional retro nav links -->
  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">Videos</a>
    <a href="#">Discover</a>
    <a href="#">Contact</a>
  </nav>
</header>

</body>
</html>
