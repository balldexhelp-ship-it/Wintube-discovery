<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WinTube</title>

<style>
body {
  font-family: Verdana, sans-serif;
  margin: 0;
  background: white;
  color: black;
}

#topbar {
  width: 100%;
  background: #0033cc;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#topbar img {
  height: 32px;
}

#controls {
  display: flex;
  gap: 20px;
  color: white;
  font-size: 14px;
  align-items: center;
}

/* LIST VIEW */
#list-view {
  padding: 20px;
}

.video-item {
  width: 100%;
  max-width: 700px;
  margin-bottom: 20px;
  cursor: pointer;
}

.video-thumb {
  width: 100%;
  border-radius: 8px;
}

.video-title {
  font-weight: bold;
  font-size: 16px;
  margin-top: 6px;
}

/* WATCH VIEW */
#watch-view {
  display: none;
  flex-direction: row;
  gap: 20px;
  padding: 20px;
}

#player-container {
  flex: 1;
  min-width: 600px;
}

#player-title {
  font-weight: bold;
  font-size: 20px;
  margin-top: 10px;
}

#api-info {
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.4;
}

/* SIDEBAR on RIGHT */
#sidebar {
  width: 300px;
  overflow-y: auto;
  max-height: 100vh;
  padding-right: 10px;
}

.sidebar-item {
  width: 100%;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 2px solid black;
  cursor: pointer;
}

.sidebar-thumb {
  width: 100%;
  border-radius: 6px;
}

.sidebar-title {
  font-weight: bold;
  font-size: 14px;
  margin-top: 6px;
}

/* PLAYER */
iframe {
  width: 100%;
  height: 360px;
  border: none;
}
</style>
</head>

<body>

<div id="topbar">
  <img src="https://i.imgur.com/Osi9wYB.png">
  <div id="controls">
    <label><input type="checkbox" id="dark-toggle"> Dark</label>
    <label><input type="checkbox" id="cat-toggle"> Categorize</label>
  </div>
</div>

<div id="list-view"></div>

<div id="watch-view">
  <div id="player-container">
    <div id="player"></div>
    <div id="player-title"></div>
    <div id="api-info"></div>
  </div>
  <div id="sidebar"></div>
</div>

<script>
// ALL VIDEOS — PLACE YOUR FULL LIST HERE
const videos = [
  { id: "QWtsV50_-p0", title: "Frutiger Areo Music Radio", thumb: "https://i.ytimg.com/vi/QWtsV50_-p0/hqdefault.jpg" },
  { id: "dQw4w9WgXcQ", title: "Never Gonna Give You Up", thumb: "https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
  { id: "Sagg08DrO5U", title: "Windows XP Bliss Secrets", thumb: "https://i.ytimg.com/vi/Sagg08DrO5U/hqdefault.jpg" },
  // add ALL your videos here exactly as needed
];

// INITIAL LIST VIEW
function renderList() {
  const el = document.getElementById("list-view");
  el.innerHTML = "";

  videos.forEach(v => {
    const div = document.createElement("div");
    div.className = "video-item";
    div.onclick = () => openVideo(v);

    div.innerHTML = `
      <img src="${v.thumb}" class="video-thumb">
      <div class="video-title">${v.title}</div>
    `;
    el.appendChild(div);
  });
}

// OPEN VIDEO
function openVideo(video) {
  document.getElementById("list-view").style.display = "none";
  document.getElementById("watch-view").style.display = "flex";

  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${video.id}?autoplay=1"></iframe>`;

  document.getElementById("player-title").textContent = video.title;

  loadAPI(video.id);
  renderSidebar(video.id);
}

// SIDEBAR
function renderSidebar(currentId) {
  const el = document.getElementById("sidebar");
  el.innerHTML = "";

  videos
    .filter(v => v.id !== currentId)
    .forEach(v => {
      const item = document.createElement("div");
      item.className = "sidebar-item";
      item.onclick = () => openVideo(v);

      item.innerHTML = `
        <img src="${v.thumb}" class="sidebar-thumb">
        <div class="sidebar-title">${v.title}</div>
      `;

      el.appendChild(item);
    });
}

// API INFO
function loadAPI(id) {
  // Placeholder since YouTube API key not inserted
  document.getElementById("api-info").innerHTML =
    "Channel Name<br>123,456 views<br><br>Description text here.";
}

renderList();
</script>

</body>
</html>
